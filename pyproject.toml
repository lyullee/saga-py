[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "saga-rag"
version = "2.0.2"
description = "SAGA Safety AI Governance Agent - Python/Open AI Service Hub RAG"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1",
  "fastapi>=0.162.3,<1",
  "starlette>=1.10,<2",
  "openai>=1.100,<3",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.33,<1",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
saga = "saga.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/saga"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests_python"]
